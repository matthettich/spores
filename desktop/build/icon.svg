<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Spores app icon: a mushroom in Thunder Plus' "IDM pink & green" skin (#e9e8e3 paper, #141414 ink, #ff2d8a pink,
       #1f9e5a green). Flat print look: offset ink shadows, step-square spots, gills like a barcode, spores rising like meters. -->
  <defs><clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="196"/></clipPath></defs>
  <rect x="64" y="64" width="896" height="896" rx="196" fill="#e9e8e3"/>
  <g clip-path="url(#tile)">
    <!-- registration marks -->
    <g stroke="#141414" stroke-width="8" stroke-linecap="square">
      <line x1="150" y1="176" x2="202" y2="176"/><line x1="176" y1="150" x2="176" y2="202"/>
      <line x1="822" y1="176" x2="874" y2="176"/><line x1="848" y1="150" x2="848" y2="202"/>
    </g>
    <!-- ground line -->
    <rect x="150" y="842" width="724" height="10" fill="#141414"/>
    <!-- stem: offset shadow, then ink outline + paper, a green band -->
    <path d="M480 560 L462 842 L602 842 L584 560 Z" fill="#141414" transform="translate(16 0)"/>
    <path d="M458 560 L440 842 L580 842 L562 560 Z" fill="#e9e8e3" stroke="#141414" stroke-width="18" stroke-linejoin="miter"/>
    <rect x="452" y="676" width="122" height="34" fill="#1f9e5a"/>
    <!-- gills: a barcode under the cap -->
    <rect x="232" y="560" width="560" height="44" fill="#141414"/>
    <g fill="#e9e8e3">
      <rect x="270" y="568" width="10" height="28"/><rect x="306" y="568" width="6" height="28"/><rect x="336" y="568" width="14" height="28"/>
      <rect x="378" y="568" width="6" height="28"/><rect x="404" y="568" width="10" height="28"/>
      <rect x="610" y="568" width="10" height="28"/><rect x="640" y="568" width="6" height="28"/><rect x="668" y="568" width="14" height="28"/>
      <rect x="708" y="568" width="6" height="28"/><rect x="736" y="568" width="10" height="28"/>
    </g>
    <!-- cap: offset ink shadow, then flat pink with an ink edge -->
    <path d="M198 560 C198 340 336 222 512 222 C688 222 826 340 826 560 Z" fill="#141414" transform="translate(22 22)"/>
    <path d="M198 560 C198 340 336 222 512 222 C688 222 826 340 826 560 Z" fill="#ff2d8a" stroke="#141414" stroke-width="18" stroke-linejoin="round"/>
    <!-- spots: five steps, one lit green -->
    <g stroke="#141414" stroke-width="12">
      <rect x="276" y="440" width="72" height="72" fill="#e9e8e3"/>
      <rect x="376" y="378" width="72" height="72" fill="#e9e8e3"/>
      <rect x="476" y="348" width="72" height="72" fill="#1f9e5a"/>
      <rect x="576" y="378" width="72" height="72" fill="#e9e8e3"/>
      <rect x="676" y="440" width="72" height="72" fill="#e9e8e3"/>
    </g>
    <!-- spores rising like meters: green on the left, ink and pink on the right -->
    <g>
      <rect x="226" y="790" width="40" height="40" fill="#1f9e5a"/>
      <rect x="226" y="738" width="40" height="40" fill="#1f9e5a"/>
      <rect x="226" y="686" width="40" height="40" fill="#1f9e5a" opacity="0.55"/>
      <rect x="226" y="634" width="40" height="40" fill="#1f9e5a" opacity="0.25"/>
      <rect x="758" y="790" width="40" height="40" fill="#141414"/>
      <rect x="758" y="738" width="40" height="40" fill="#ff2d8a"/>
      <rect x="758" y="686" width="40" height="40" fill="#ff2d8a" opacity="0.5"/>
      <rect x="300" y="806" width="22" height="22" fill="#141414"/>
      <rect x="702" y="806" width="22" height="22" fill="#1f9e5a"/>
    </g>
  </g>
</svg>
