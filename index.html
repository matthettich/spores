<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>...Spores</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/audio.css">
  <link rel="stylesheet" href="css/fx.css">
  <link rel="stylesheet" href="css/songselect.css">
  <!-- the saved skin (js/ui/skin.js): inline so the first paint is already in it, not two frames of the old one -->
  <script>
    try { var s = localStorage.getItem('spores.skin'); s = {black: 'tr808', pastel: 'tr909'}[s] || s; if (s) { document.documentElement.dataset.skin = s; localStorage.setItem('spores.skin', s); } } catch (e) {}   // (retired skins → the nearest one, as js/ui/skin.js)
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
